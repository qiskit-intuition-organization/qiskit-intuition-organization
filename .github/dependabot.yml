# Weekly dependency updates, Monday 09:00 IST (03:30 UTC).
# Security fixes arrive as soon as an advisory is published (Dependabot security updates).
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule: { interval: weekly, day: monday, time: "03:30" }
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: "/web"
    schedule: { interval: weekly, day: monday, time: "03:30" }
    open-pull-requests-limit: 5
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly, day: monday, time: "03:30" }
