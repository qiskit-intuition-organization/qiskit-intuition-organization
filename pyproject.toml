[project]
name = "qiskit-intuition-backend"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
    "qiskit>=1.0.0,<3.0.0",
    "qiskit-aer>=0.14.0,<0.18.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "PyJWT>=2.10.0,<3.0.0",
    "argon2-cffi>=23.1.0,<26.0.0",
    "email-validator>=2.2.0,<3.0.0",
    "SQLAlchemy>=2.0.0,<3.0.0",
    "sqlalchemy-libsql==0.2.0",
]

# Kept out of the Vercel bundle: every MB here is installed on each cold start,
# and the full set overflowed the function's temporary disk.
[project.optional-dependencies]
# The AI coach is optional; without GEMINI_API_KEY (or this extra) the
# built-in coach answers. Install with: uv sync --extra ai
ai = ["google-genai>=0.3.0"]
# Figures from learner code and circuit images; the sandbox runs without them.
plots = ["matplotlib>=3.8.0", "pylatexenc>=2.10"]

[dependency-groups]
dev = ["ruff>=0.4.0"]

[tool.vercel]
entrypoint = "backend.main:app"
